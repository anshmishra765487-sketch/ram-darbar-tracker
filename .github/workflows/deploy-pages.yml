name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Project page sub-path, e.g. /ram-darbar-tracker/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Backend API base URL. Set a repo variable VITE_API_URL
          # (Settings > Secrets and variables > Actions > Variables) to change it
          # without editing this file. Falls back to the current demo tunnel.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://properties-jam-received-recipients.trycloudflare.com/api' }}
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
